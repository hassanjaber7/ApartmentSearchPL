<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚗 Apartment Alerts - Subscribe</title>
    <style>
        /* ============================================
           CSS STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 50px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 5px;
        }

        .header p {
            color: #718096;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #f7fafc;
            color: #1a202c;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            background: white;
        }

        .form-group input::placeholder {
            color: #a0aec0;
        }

        .form-group .hint {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 4px;
        }

        .price-row {
            display: flex;
            gap: 15px;
        }

        .price-row .form-group {
            flex: 1;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 16px;
            border-radius: 12px;
            font-size: 14px;
            display: none;
            text-align: center;
        }

        .message.success {
            display: block;
            background: #f0fff4;
            color: #38a169;
            border: 1px solid #9ae6b4;
        }

        .message.error {
            display: block;
            background: #fff5f5;
            color: #e53e3e;
            border: 1px solid #feb2b2;
        }

        .message.info {
            display: block;
            background: #ebf8ff;
            color: #3182ce;
            border: 1px solid #90cdf4;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #a0aec0;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            .header h1 {
                font-size: 22px;
            }
            .form-group input {
                font-size: 14px;
                padding: 12px 14px;
            }
            .price-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ============================================
        HEADER
        ============================================ -->
        <div class="header">
            <div class="icon">🏠</div>
            <h1>Apartment Alerts</h1>
            <p>Get notified when new apartments match your criteria</p>
        </div>

        <!-- ============================================
        FORM
        ============================================ -->
        <form id="subscribeForm" novalidate>
            <!-- City -->
            <div class="form-group">
                <label for="city">📍 City</label>
                <input
                    type="text"
                    id="city"
                    placeholder="e.g., Warsaw, Krakow, Gdansk"
                    required
                />
                <div class="hint">Enter the city where you want to search for apartments</div>
            </div>

            <!-- Price Range (Min and Max) -->
            <div class="price-row">
                <div class="form-group">
                    <label for="minPrice">💰 Min Price (PLN)</label>
                    <input
                        type="number"
                        id="minPrice"
                        placeholder="e.g., 1000"
                        min="0"
                        required
                    />
                </div>
                <div class="form-group">
                    <label for="maxPrice">💰 Max Price (PLN)</label>
                    <input
                        type="number"
                        id="maxPrice"
                        placeholder="e.g., 2500"
                        min="0"
                        required
                    />
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                🔔 Subscribe Now
            </button>
        </form>

        <!-- ============================================
        MESSAGE AREA
        ============================================ -->
        <div id="message" class="message"></div>

        <!-- ============================================
        FOOTER
        ============================================ -->
        <div class="footer">
            <p>You'll receive alerts when new listings are found. Unsubscribe anytime.</p>
            <p style="margin-top: 5px;">
                <a href="#" id="unsubscribeLink">Unsubscribe</a>
            </p>
        </div>

    </div>

    <!-- ============================================
    JAVASCRIPT
    ============================================ -->
    <script>
        // ============================================
        // CONFIGURATION - REPLACE THESE VALUES!
        // ============================================

        // ✅ Get your bot token from @BotFather
        const TELEGRAM_BOT_TOKEN = '8835848289:AAFXUui_YKyWy2JrbFanhJJGZCVUH9tgmwA';

        // ✅ Your personal Telegram chat ID (where you want to receive notifications)
        const ADMIN_CHAT_ID = '7518690070';

        // ============================================
        // DOM REFERENCES
        // ============================================

        const form = document.getElementById('subscribeForm');
        const cityInput = document.getElementById('city');
        const minPriceInput = document.getElementById('minPrice');
        const maxPriceInput = document.getElementById('maxPrice');
        const submitBtn = document.getElementById('submitBtn');
        const messageEl = document.getElementById('message');
        const unsubscribeLink = document.getElementById('unsubscribeLink');

        // ============================================
        // HELPERS
        // ============================================

        function showMessage(text, type = 'info') {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            clearTimeout(window.messageTimeout);
            window.messageTimeout = setTimeout(() => {
                messageEl.className = 'message';
            }, 8000);
        }

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<span class="spinner"></span> Subscribing...`;
            } else {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '🔔 Subscribe Now';
            }
        }

        function validatePrice(price) {
            return !isNaN(price) && parseInt(price) >= 0;
        }

        // ============================================
        // FORM VALIDATION
        // ============================================

        function validateForm() {
            const city = cityInput.value.trim();
            const minPrice = minPriceInput.value.trim();
            const maxPrice = maxPriceInput.value.trim();

            if (!city) {
                showMessage('📍 Please enter a city.', 'error');
                return false;
            }

            if (!minPrice || !validatePrice(minPrice)) {
                showMessage('💰 Please enter a valid minimum price.', 'error');
                return false;
            }

            if (!maxPrice || !validatePrice(maxPrice)) {
                showMessage('💰 Please enter a valid maximum price.', 'error');
                return false;
            }

            if (parseInt(minPrice) > parseInt(maxPrice)) {
                showMessage('⚠️ Minimum price cannot be greater than maximum price.', 'error');
                return false;
            }

            return true;
        }

        // ============================================
        // ✅ FORM SUBMISSION - ADMIN CONFIRMATION FLOW
        // ============================================

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Validate form
            if (!validateForm()) {
                return;
            }

            // Get all values
            const city = cityInput.value.trim();
            const minPrice = minPriceInput.value.trim();
            const maxPrice = maxPriceInput.value.trim();

            // Show loading state
            setLoading(true);
            showMessage('⏳ Subscribing...', 'info');

            try {
                // ✅ Create the callback data with ALL user preferences
                // Format: confirm_{city}|{minPrice}|{maxPrice}
                const callbackData = `confirm_${city}|${minPrice}|${maxPrice}`;

                // ✅ Send the data to your bot
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: ADMIN_CHAT_ID,
                        text: `📱 *New Subscriber Request!*\n\n` +
                              `📍 *City:* ${city}\n` +
                              `💰 *Min Price:* ${minPrice} PLN\n` +
                              `💰 *Max Price:* ${maxPrice} PLN\n` +
                              `📅 *Date:* ${new Date().toLocaleString()}\n` +
                              `🌐 *Source:* Website\n\n` +
                              `📊 *Filter Details:*\n` +
                              `• Searching for apartments in ${city}\n` +
                              `• Price range: ${minPrice} - ${maxPrice} PLN`,
                        parse_mode: 'Markdown',
                        reply_markup: {
                            inline_keyboard: [[
                                { text: '✅ Confirm Subscription', callback_data: callbackData }
                            ]]
                        }
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    showMessage(`✅ Subscription request sent! Check your Telegram to confirm.`, 'success');
                    cityInput.value = '';
                    minPriceInput.value = '';
                    maxPriceInput.value = '';
                } else {
                    showMessage(`❌ ${data.description || 'Something went wrong. Please try again.'}`, 'error');
                }

            } catch (error) {
                console.error('Error:', error);
                showMessage(`❌ Could not subscribe. Please try again later.`, 'error');
            }

            setLoading(false);
        });

        // ============================================
        // UNSUBSCRIBE
        // ============================================

        unsubscribeLink.addEventListener('click', function(e) {
            e.preventDefault();

            const city = cityInput.value.trim();

            if (!city) {
                showMessage('📍 Please enter a city to unsubscribe.', 'info');
                return;
            }

            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: ADMIN_CHAT_ID,
                    text: `❌ *Unsubscribe request!*\n\n📍 City: ${city}`,
                    parse_mode: 'Markdown',
                })
            })
            .then(res => res.json())
            .then(() => {
                showMessage(`✅ Unsubscribe request sent.`, 'success');
                cityInput.value = '';
                minPriceInput.value = '';
                maxPriceInput.value = '';
            })
            .catch(() => {
                showMessage(`❌ Could not unsubscribe. Please try again.`, 'error');
            });
        });

        // Keyboard shortcut
        cityInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });

        console.log('🚀 Apartment Alerts subscription page loaded!');
        console.log('📱 Bot token:', TELEGRAM_BOT_TOKEN ? 'Set ✅' : 'Not set ❌');
        console.log('📱 Admin Chat ID:', ADMIN_CHAT_ID ? 'Set ✅' : 'Not set ❌');
    </script>

</body>
</html>
